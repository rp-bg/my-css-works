<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Auto G — The Lux Car</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="hero">

        </div>
        <div class="overlay overlay-right" data-start="0.55" data-end="0.75">
          <h2>Comfortable Drive.</h2>
        </div>
        <div class="overlay overlay-center-cta" data-start="0.85" data-end="1">
          <a class="cta" href="#">Move with Pride.</a>
        </div>
      </div>
    </section>
    <section class="content">
      <div class="container">
        <p class="muted">Scroll to experience the engineering reveal.</p>
      </div>
    </section>
  </main>

  <script src="car.js" type="module"></script>

</html>
